[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sastac"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25.0",
    "tree_sitter_typescript",
    "tree_sitter_java",
    "tree_sitter_python",
    "tree_sitter_go",
    "tree-sitter-javascript>=0.25.0",
    "qdrant-client>=1.17.0",
    "pyyaml>=6.0.3",
    "ollama>=0.6.1",
    "python-dotenv>=1.0.1",
    "open-webui>=0.8.8",
]

# Optional dependency groups
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-asyncio"
]

# ---- Tool Configurations ----

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (requires Ollama server + bge-m3 model)",
]
addopts = "-ra --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sastac.files.config" = ["*.yaml"]
"sastac.files" = ["*.txt", "prompts/*.txt"]
